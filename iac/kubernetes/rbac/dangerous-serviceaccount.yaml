# BENCH-IAC-040: K8s ServiceAccount bound to dangerous ClusterRole
# Tests: Identity and access configuration analysis (IaC context)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dangerous-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dangerous-sa-binding
subjects:
  - kind: ServiceAccount
    name: dangerous-sa
    namespace: default
roleRef:
  kind: ClusterRole
  name: cluster-admin  # Full cluster admin access!
  apiGroup: rbac.authorization.k8s.io
